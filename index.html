<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stoch Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>
<body>

  <div class="calculator">
    <!-- Header Nativo Infinix -->
    <div class="top-bar">
      <button class="icon-btn float-btn" title="Ventana flotante">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 3h6M3 9v6"/></svg>
      </button>

      <div class="top-pill">
        <button class="pill-icon" onclick="toggleHistory()" title="Historial">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <button class="pill-icon" onclick="openCurrency()" title="Divisas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </button>
        <button class="pill-icon" onclick="openUnits()" title="Unidades">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5v14l18-7z"/><path d="M8 8v3M12 10v3M16 12v3"/></svg>
        </button>
      </div>
    </div>

    <!-- Pantalla -->
    <div class="display">
      <div id="history" class="history"></div>
      <div id="expression" class="expression">0</div>
      <div id="result" class="result"></div>
    </div>

    <!-- Panel Científico Desplegable (Corta/Limpio) -->
    <div id="sci-panel" class="sci-panel hidden">
      <button class="btn-sci" onclick="addInput('sin(')">sin</button>
      <button class="btn-sci" onclick="addInput('cos(')">cos</button>
      <button class="btn-sci" onclick="addInput('tan(')">tan</button>
      <button class="btn-sci" onclick="addInput('log10(')">log</button>
      <button class="btn-sci" onclick="addInput('sqrt(')">√</button>
      <button class="btn-sci" onclick="addInput('^')">xⁿ</button>
    </div>

    <!-- Teclado Estándar Infinix (Círculos) -->
    <div class="keypad">
      <!-- Fila 1 -->
      <button class="btn btn-top" onclick="clearAll()">AC</button>
      <button class="btn btn-top" onclick="addInput('%')">%</button>
      <button class="btn btn-top" onclick="deleteLast()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>
      <button class="btn btn-op" onclick="addInput('/')">÷</button>

      <!-- Fila 2 -->
      <button class="btn btn-num" onclick="addInput('7')">7</button>
      <button class="btn btn-num" onclick="addInput('8')">8</button>
      <button class="btn btn-num" onclick="addInput('9')">9</button>
      <button class="btn btn-op" onclick="addInput('*')">×</button>

      <!-- Fila 3 -->
      <button class="btn btn-num" onclick="addInput('4')">4</button>
      <button class="btn btn-num" onclick="addInput('5')">5</button>
      <button class="btn btn-num" onclick="addInput('6')">6</button>
      <button class="btn btn-op" onclick="addInput('-')">-</button>

      <!-- Fila 4 -->
      <button class="btn btn-num" onclick="addInput('1')">1</button>
      <button class="btn btn-num" onclick="addInput('2')">2</button>
      <button class="btn btn-num" onclick="addInput('3')">3</button>
      <button class="btn btn-op" onclick="addInput('+')">+</button>

      <!-- Fila 5 (Ícono Científico en vez de texto 'fx') -->
      <button class="btn btn-num btn-sci-toggle" onclick="toggleSciPanel()" title="Funciones Científicas">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 8h2M7 12h4M7 16h2M14 8l3 4 3-4M14 16h6"/></svg>
      </button>
      <button class="btn btn-num" onclick="addInput('0')">0</button>
      <button class="btn btn-num" onclick="addInput('.')">.</button>
      <button class="btn btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
